name: CI
on: [push, pull_request]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run setup:toolchains
        env:
          PSEUDO_TOOLS_DIR: /tmp/pseudo-tools
      - run: npx playwright install --with-deps chromium
      - run: |
          export CHROMIUM_PATH="$(node --input-type=module -e 'import {chromium} from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          npm run accept
        env:
          ECJ_JAR: /tmp/pseudo-tools/ecj.jar
          DOTNET_BIN: /tmp/pseudo-tools/dotnet/dotnet
          PSEUDO_SPEC_CACHE: /tmp/pseudo-specs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evidence
          path: docs/validation
