<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        document.documentElement.classList.toggle(
          "dark",
          localStorage.getItem("theme") === "dark",
        );
        document.documentElement.lang =
          localStorage.getItem("locale") === "zh-CN" ? "zh-CN" : "en";
      } catch {
        // Storage may be blocked; the default light theme remains usable.
      }
    </script>
    <style>
      html.dark {
        background: #10121e;
      }
    </style>
    <meta name="theme-color" content="#101a27" />
    <title>Pseudocode Ultra · Cambridge Pseudocode IDE</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/web/main.ts"></script>
  </body>
</html>
